<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennessee Permit Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, one question card at a time, big tap targets for phone use. Single dark theme by choice, same family as the portfolio. */
:root {
  color-scheme: dark;
  --ink: #0b1020;
  --panel: #121a30;
  --line: #24304f;
  --text: #e6e9f2;
  --muted: #8b95b3;
  --amber: #ffb454;
  --cyan: #5ccfe6;
  --good: #7bd88f;
  --bad: #ff6b6b;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 22px; }
a { color: var(--cyan); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.2; text-wrap: balance; }
.top h1 span { color: var(--amber); }
.top p { margin: 0; color: var(--muted); font-size: 15px; }
.gear { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 13px; }
.gear:hover { border-color: var(--cyan); }

.settings { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.set-row span { font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--muted); padding: 6px 14px; cursor: pointer; font-family: var(--font-mono); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--ink); font-weight: 700; }
.danger { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--bad); padding: 6px 14px; cursor: pointer; font-size: 14px; }

.facts { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--font-mono); font-size: 13px; }
.facts span { border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; color: var(--cyan); }
.modes { display: grid; gap: 12px; }
.mode { display: grid; gap: 4px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 8px; padding: 14px 18px; color: var(--text); cursor: pointer; }
.mode:hover { border-color: var(--amber); }
.mode.alt { border-left-color: var(--cyan); }
.mode b { font-size: 1.05rem; }
.mode small { color: var(--muted); font-size: 14px; }
.mode[disabled] { opacity: .45; cursor: not-allowed; }
h2 { margin: 0; font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--muted); }

.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.cats button { display: grid; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; cursor: pointer; text-align: left; }
.cats button:hover { border-color: var(--cyan); }
.cats small { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center; }
.stats b { display: block; font-family: var(--font-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.link { background: none; border: 0; color: var(--cyan); cursor: pointer; padding: 4px 0; font-family: var(--font-mono); font-size: 13px; }
.track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--amber); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tag { font-family: var(--font-mono); font-size: 12px; color: var(--amber); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 4px; }
.switch .on { color: var(--text); font-weight: 700; }
.knob { position: relative; width: 38px; height: 20px; border-radius: 10px; background: var(--line); transition: background .15s; }
.knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.switch[aria-checked="true"] .knob { background: var(--amber); }
.switch[aria-checked="true"] .knob::after { transform: translateX(18px); }
.q { margin: 0; font-size: 1.12rem; font-weight: 600; line-height: 1.45; }
.sign { display: flex; justify-content: center; }
.sign svg { width: 112px; height: 112px; }
.opts { display: grid; gap: 10px; }
.opts button { display: flex; gap: 10px; text-align: left; width: 100%; min-height: 48px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--text); cursor: pointer; }
.opts button kbd { flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 3px; }
.opts button:hover:not([disabled]) { border-color: var(--cyan); }
.opts button.sel { border-color: var(--amber); }
.opts button.right { border-color: var(--good); color: var(--good); }
.opts button.wrong { border-color: var(--bad); color: var(--bad); }
.opts button[disabled] { cursor: default; }
.why { border-top: 1px dashed var(--line); padding-top: 14px; color: var(--muted); font-size: 15px; }
.why b { color: var(--text); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.next { background: var(--amber); color: var(--ink); border: 0; border-radius: 6px; padding: 10px 22px; font-weight: 700; cursor: pointer; }
.next[disabled] { opacity: .4; cursor: not-allowed; }
.ghost { background: transparent; color: var(--cyan); border: 1px solid var(--line); border-radius: 6px; padding: 10px 16px; cursor: pointer; }
.ghost[disabled] { opacity: .35; cursor: not-allowed; }
.note { margin: 0; color: var(--amber); font-size: 14px; text-align: right; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dots button { width: 30px; height: 30px; border-radius: 6px; background: transparent; border: 1px solid var(--line); color: var(--muted); font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 0; }
.dots button.done { border-color: var(--cyan); color: var(--cyan); }
.dots button.cur { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
.hint { margin: 0; color: var(--muted); font-size: 12px; font-family: var(--font-mono); text-align: center; }

.score { text-align: center; display: grid; gap: 6px; }
.score .num { font-family: var(--font-mono); font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.pass { color: var(--good); } .fail { color: var(--bad); }
.breakdown { display: grid; gap: 8px; text-align: left; font-size: 14px; margin-top: 8px; }
.breakdown div { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.breakdown b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 12px; }
.review article { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; font-size: 15px; }
.review p { margin: 0; }
.review .a { color: var(--good); } .review .y { color: var(--bad); } .review .w { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.chat { display: grid; gap: 12px; }
.log { display: grid; gap: 10px; max-height: 52vh; overflow-y: auto; padding-right: 2px; }
.msg { max-width: 92%; border-radius: 10px; padding: 10px 14px; font-size: 15px; white-space: pre-wrap; }
.msg.me { justify-self: end; background: var(--amber); color: var(--ink); }
.msg.bot { justify-self: start; background: var(--ink); border: 1px solid var(--line); }
.msg.bot small { display: block; margin-top: 8px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: transparent; border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px; color: var(--cyan); font-size: 13px; cursor: pointer; }
.chips button:hover { border-color: var(--cyan); }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--text); font: inherit; }

footer { display: grid; gap: 10px; color: var(--muted); font-size: 13px; }
.sig { justify-self: end; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.sig b { color: var(--amber); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .knob, .knob::after { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <button type="button" class="gear" id="gear" aria-expanded="false"></button>
  </div>
  <div class="settings" id="settings" hidden></div>
  <main id="app"></main>
  <footer>
    <span id="disc"></span>
    <span class="sig">made by <b>Tuan Phong Vo</b></span>
  </footer>
</div>

      f1: '30 câu', f2: 'đậu từ 24 câu (80%)', f3: '4 phần',
      exam: 'Thi thử', examSub: '30 câu ngẫu nhiên, trả lời xong biết đúng sai ngay, cần đúng 24 câu.',
      all: 'Luyện tất cả {n} câu', allSub: 'Chọn xong hiện đáp án và giải thích ngay.',

      askPh: 'vd: tốc độ ở khu trường học', send: 'Hỏi',
      hello: 'Hỏi tôi về tốc độ, biển báo, quyền ưu tiên, luật DUI, khoảng cách đậu xe, hay cách xử lý tình huống khẩn cấp. Tôi trả lời từ bộ tài liệu có sẵn trong trang, nên chỉ biết các chủ đề lái xe ở Tennessee.',

      related: 'Câu luyện tập liên quan:', chips: ['Tốc độ khu trường học', 'Nồng độ cồn dưới 21 tuổi', 'Khi nào bật đèn pha', 'Ngã tư 4 biển dừng', 'Luật xe buýt trường', 'Thi bao nhiêu câu?']

    signs: { en: 'Signs, signals, markings', vi: 'Biển báo, đèn, vạch kẻ' },

  var SIGNS = {
    octagon: '<svg viewBox="0 0 100 100" role="img" aria-label="Red eight-sided sign"><polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30" fill="#d62828" stroke="#fff" stroke-width="4"/></svg>',

    diamond: '<svg viewBox="0 0 100 100" role="img" aria-label="Yellow diamond sign"><polygon points="50,5 95,50 50,95 5,50" fill="#f9c80e" stroke="#111" stroke-width="3"/></svg>',
    pentagon: '<svg viewBox="0 0 100 100" role="img" aria-label="Five-sided sign shaped like a house"><polygon points="50,5 93,40 93,95 7,95 7,40" fill="#c8e000" stroke="#111" stroke-width="3"/></svg>',
    round: '<svg viewBox="0 0 100 100" role="img" aria-label="Round yellow sign with a black X"><circle cx="50" cy="50" r="45" fill="#f9c80e" stroke="#111" stroke-width="3"/><path d="M22 22 L78 78 M78 22 L22 78" stroke="#111" stroke-width="7"/></svg>',
    donotenter: '<svg viewBox="0 0 100 100" role="img" aria-label="Red circle with a white horizontal bar"><circle cx="50" cy="50" r="45" fill="#d62828" stroke="#fff" stroke-width="3"/><rect x="20" y="42" width="60" height="16" fill="#fff"/></svg>',
    smv: '<svg viewBox="0 0 100 100" role="img" aria-label="Orange triangle with a red border"><polygon points="50,6 96,90 4,90" fill="#d62828"/><polygon points="50,30 76,78 24,78" fill="#ff7a00"/></svg>',

  // extra drawings built from small helpers: signals, road markings, colored signs
  (function () {
    var OFF = '#2a2f3d', R = '#e5383b', Y = '#f9c80e', G = '#2dc653';
    function wrap(inner) { return '<svg viewBox="0 0 100 100" role="img" aria-label="Illustration for this question">' + inner + '</svg>'; }
    function rays(cy, col) { return '<g stroke="' + col + '" stroke-width="3" stroke-linecap="round"><path d="M22 ' + cy + ' H14 M78 ' + cy + ' H86 M26 ' + (cy - 10) + ' L19 ' + (cy - 15) + ' M74 ' + (cy - 10) + ' L81 ' + (cy - 15) + ' M26 ' + (cy + 10) + ' L19 ' + (cy + 15) + ' M74 ' + (cy + 10) + ' L81 ' + (cy + 15) + '"/></g>'; }

    function signal(o) {
      var cys = [22, 50, 78], cols = [o.r ? R : OFF, o.y ? Y : OFF, o.g ? G : OFF], out = '<rect x="30" y="4" width="40" height="92" rx="8" fill="#11141c" stroke="#555" stroke-width="2"/>';

      if (o.arrow === 'y') out += arrow(50, Y);
      if (o.flash === 'r') out += rays(22, R);
      if (o.flash === 'y') out += rays(50, Y);
      return wrap(out);
    }
    function line(x, col, dashed) { return '<line x1="' + x + '" y1="0" x2="' + x + '" y2="100" stroke="' + col + '" stroke-width="4"' + (dashed ? ' stroke-dasharray="14 12"' : '') + '/>'; }

    SIGNS.dblyellow = road(line(46, Y) + line(54, Y));

    SIGNS.solidside = road(line(46, Y, true) + line(54, Y) + '<path d="M76 88 V62 M76 62 L70 70 M76 62 L82 70" stroke="' + W + '" stroke-width="3" fill="none" stroke-linecap="round"/>');

    ['alcohol', '', 'Can you be convicted of DUI for driving after taking prescription or over-the-counter medicine?', ['Yes, if the drug impairs your ability to drive', 'No, legal drugs are always allowed', 'Only if you also drank alcohol', 'Only for drivers under 21'], 'Yes. Any drug that impairs your driving can lead to a DUI, even a legal one.',

    ['alcohol', '', 'A 12-ounce beer, a 5-ounce glass of wine, and a 1.5-ounce shot of liquor contain:', ['About the same amount of alcohol', 'Very different amounts, beer is the weakest', 'No alcohol if consumed with food', 'Less alcohol if consumed slowly'], 'These three standard drinks hold about the same amount of alcohol.',

    ['alcohol', '', 'Mixing alcohol with other drugs:', ['Can greatly increase the effects of both', 'Cancels out the alcohol', 'Has no effect on driving', 'Is safe with prescription drugs'], 'Alcohol combined with other drugs can multiply the effects of both.',

    ['alcohol', '', 'In Tennessee, a driver may not:', ['Drink alcohol or have an open container while driving', 'Carry sealed alcohol in the trunk', 'Drive a passenger who has been drinking', 'Buy alcohol on a weekday'], 'A driver may not drink or keep an open container of alcohol while operating a vehicle.',

    ['safe', '', 'In rain, fog, or on slippery roads, you should:', ['Slow down and increase your following distance', 'Keep your normal speed and distance', 'Follow closely to see the car ahead', 'Drive in the left lane only'], 'Bad conditions call for lower speed and more space between you and the car ahead.',

    ['safe', '', 'If your vehicle starts to hydroplane, you should:', ['Ease off the gas and keep the wheel steady', 'Brake hard', 'Accelerate to regain traction', 'Turn the wheel sharply'], 'When hydroplaning, lift off the gas gently and keep the wheel straight. Do not brake hard.',

    ['safe', '', 'If your car begins to skid, you should:', ['Take your foot off the gas and steer in the direction you want the front of the car to go', 'Brake hard and hold the wheel straight', 'Steer the opposite way of the skid', 'Shift into neutral and brake'], 'In a skid, ease off the gas and steer where you want the front of the car to go.',

    ['safe', '', 'A driver is tailgating you. You should:', ['Move to another lane or let them pass when it is safe', 'Brake suddenly to warn them', 'Speed up to get away', 'Ignore them and hold your lane'], 'Let a tailgater pass. Change lanes or make room when it is safe.',

    ['safe', '', 'When driving near a large truck, remember that:', ["If you cannot see the truck's mirrors, the driver cannot see you", 'Trucks can stop faster than cars', 'It is safest to follow closely behind', 'Truck drivers can see everything around them'], "Trucks have large blind spots called no-zones. No mirror in view means the driver can't see you.",

    ['alcohol', '', 'A driver under 21 convicted of driving with a BAC of 0.02% or more can lose their license for:', ['One year', 'One week', '30 days', '90 days'], 'Underage impaired driving brings a one-year license suspension along with a fine.',

    ['alcohol', '', 'Marijuana affects driving by:', ['Slowing reaction time and distorting your sense of time and distance', 'Making you a more careful driver', 'Improving concentration', 'Having no effect after one hour'], 'Marijuana slows reactions and makes it harder to judge distance and speed.',

    ['alcohol', '', 'Before driving while taking a new medicine, you should:', ['Read the label or ask a doctor or pharmacist how it affects driving', 'Assume it is safe because it is legal', 'Take a double dose to be sure', 'Drink coffee with it'], 'Many medicines cause drowsiness. Check the label or ask before you drive.',

    ['alcohol', '', 'A first DUI conviction in Tennessee can bring:', ['Jail time, a fine, and loss of your license', 'Only a warning letter', 'Only a small fine', 'Only extra points'], 'Even a first DUI carries jail time, fines and a revoked license.',

    ['alcohol', '', 'How many drinks does it take to affect your driving?', ['Even one drink can affect it', 'At least three', 'At least five', 'Only drinks of hard liquor count'], 'Judgment and reaction begin to change with the first drink.',

    ['alcohol', '', 'Your friend has been drinking and wants to drive home. You should:', ['Stop them from driving and arrange another ride', 'Let them drive if they feel fine', 'Give them coffee and send them off', 'Follow them in your car'], 'Do not let an impaired person drive. Offer a ride, call one, or let them stay.',

    ['alcohol', '', 'Eating food before or while drinking:', ['Slows alcohol absorption but does not prevent impairment', 'Keeps you completely sober', 'Removes alcohol from your blood', 'Makes it legal to drive'], 'Food slows how fast alcohol reaches the blood. It does not stop you from becoming impaired.',

    ['safe', '', 'To keep a safe following distance in normal conditions, the Tennessee manual teaches the:', ['Two-second rule', 'One car length rule', 'Half-second rule', 'Ten-foot rule'], 'Pick a fixed object. When the car ahead passes it, you should reach it no sooner than two seconds later. Add more time in bad conditions.',

    ['safe', '', 'When driving at night you should be able to stop:', ['Within the distance lit by your headlights', 'Within twice the distance you can see', 'Only after passing the next intersection', 'Within 500 feet no matter what'], 'Do not overdrive your headlights. If you cannot stop inside the lit area, you are going too fast.',

    var sc = el('div', 'card score');
    sc.appendChild(el('div', 'num ' + (pass ? 'pass' : 'fail'), S.right + ' / ' + total));
    sc.appendChild(el('div', null, S.exam ? t(pass ? 'passMsg' : 'failMsg', { need: need, right: S.right }) : t('pct', { label: label(), p: Math.round(S.right / total * 100) })));
    if (S.exam) {
      sc.appendChild(el('div', 'tag', t('time') + ' ' + fmt(S.secs)));
      var bd = el('div', 'breakdown');
      Object.keys(CATS).forEach(function (c) {
        var tot = 0, ok = 0;
        S.list.forEach(function (x, i) { if (x.c === c) { tot++; if (S.answers[i] === 0) ok++; } });
        if (!tot) return;
        var r = el('div'); r.appendChild(el('span', null, CATS[c][D.ui])); r.appendChild(el('b', ok / tot >= 0.8 ? 'pass' : 'fail', ok + '/' + tot)); bd.appendChild(r);
      });
      sc.appendChild(bd);
    }
    app.appendChild(sc);

    var row = el('div', 'row');
    row.appendChild(btn('next', t('home'), home));
    app.appendChild(row);

    var wrong = [];
    S.list.forEach(function (x, i) { if (S.answers[i] !== 0) wrong.push([x, S.answers[i]]); });
    if (wrong.length) {
      app.appendChild(el('h2', null, t('missedHead', { n: wrong.length })));
      var rv = el('div', 'review');
      wrong.forEach(function (it) {
        var L = it[0][D.ui], a = el('article');
        a.appendChild(el('p', null, L.q));
        a.appendChild(el('p', 'y', t('you') + (it[1] == null ? t('none') : L.o[it[1]])));
        a.appendChild(el('p', 'a', t('ans') + L.o[0]));
        a.appendChild(el('p', 'w', L.w));
        rv.appendChild(a);
      });
      app.appendChild(rv);
    }
    if (!again) window.scrollTo(0, 0);
  }

  // ---------- assistant ----------
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9.\- ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  var STOP = { the: 1, a: 1, an: 1, is: 1, are: 1, what: 1, when: 1, how: 1, do: 1, does: 1, i: 1, to: 1, of: 1, in: 1, on: 1, for: 1, and: 1, or: 1, you: 1, my: 1, it: 1, can: 1, should: 1, la: 1, gi: 1, thi: 1, co: 1, khi: 1, nao: 1, bao: 1, nhieu: 1, toi: 1, o: 1, va: 1, hay: 1, the: 1, duoc: 1, khong: 1, phai: 1, lam: 1, sao: 1 };
  function answer(text) {
    var qn = ' ' + norm(text) + ' ';
    var scored = KB.map(function (e) {
      var s = 0;
      e.k.forEach(function (k) { if (qn.indexOf(' ' + k) > -1) s += 1 + k.split(' ').length; });
      return [s, e];
    }).filter(function (p) { return p[0] > 0; }).sort(function (a, b) { return b[0] - a[0]; });

    var words = qn.trim().split(' ').filter(function (w) { return w.length > 2 && !STOP[w]; });
    var qs = Q.map(function (x) {
      var hay = ' ' + norm(x.en.q + ' ' + x.en.o[0] + ' ' + x.vi.q + ' ' + x.vi.o[0]) + ' ', s = 0;
      words.forEach(function (w) { if (hay.indexOf(' ' + w + ' ') > -1) s++; });
      return [s, x];
    }).filter(function (p) { return p[0] >= 2; }).sort(function (a, b) { return b[0] - a[0]; });

    var parts = [];
    if (scored.length) {
      parts.push(scored[0][1][D.ui]);
      if (scored[1] && scored[1][0] >= scored[0][0] * 0.6) parts.push(scored[1][1][D.ui]);
    }
    var rel = qs.length ? qs[0][1] : null;
    if (!parts.length && rel) parts.push(rel[D.ui].w);
    if (!parts.length) return { text: t('noHit') };
    return { text: parts.join('\n\n'), rel: rel ? rel[D.ui].q + ' → ' + rel[D.ui].o[0] : null };
  }
  function chat() {
    view = 'chat'; stopTimer(); S = null;
    app.textContent = '';
    var bar = el('div', 'bar');
    bar.appendChild(btn('link', t('quit'), home));
    bar.appendChild(el('span', null, t('ask')));
    app.appendChild(bar);

    var card = el('div', 'card chat');
    var log = el('div', 'log');
    log.setAttribute('aria-live', 'polite');
    function bubble(m) {
      var d = el('div', 'msg ' + m.who, m.text);
      if (m.rel) d.appendChild(el('small', null, t('related') + ' ' + m.rel));
      log.appendChild(d);
    }
    bubble({ who: 'bot', text: t('hello') });
    chatLog.forEach(bubble);
    card.appendChild(log);

    function ask(text) {
      text = text.trim(); if (!text) return;
      var a = answer(text);
      var m1 = { who: 'me', text: text }, m2 = { who: 'bot', text: a.text, rel: a.rel };
      chatLog.push(m1, m2); bubble(m1); bubble(m2);
      log.scrollTop = log.scrollHeight;
    }
    var chips = el('div', 'chips');
    t('chips').forEach(function (c) { chips.appendChild(btn(null, c, function () { ask(c); })); });
    card.appendChild(chips);

    var form = el('form', 'ask');
    var inp = el('input'); inp.type = 'text'; inp.id = 'askInput'; inp.placeholder = t('askPh'); inp.setAttribute('aria-label', t('ask')); inp.autocomplete = 'off';
    var send = el('button', 'next', t('send')); send.type = 'submit';
    form.appendChild(inp); form.appendChild(send);
    form.addEventListener('submit', function (e) { e.preventDefault(); ask(inp.value); inp.value = ''; });
    card.appendChild(form);
    app.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }

  window.__prep = { answer: answer, Q: Q, D: D };
  chrome();
  home();
})();
</script>
